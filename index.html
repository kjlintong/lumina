<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina — 家庭灯光设计系统</title>
  <style>
    /* ===================================================================
       P10 — Design tokens（收敛散点色值/圆角/边框/字号为语义变量）。
       本轮**只**新增 token 层，不引入 CSS 框架；`:root` 是变量定义源，
       下方规则全部改用 `var(--xxx)`。详见 docs/P10-ui-polish-spec.md §2。
       =================================================================== */
    :root {
      /* 背景层次 */
      --bg-deep: #1a1a2e;                 /* body 主背景 */
      --bg-panel: rgba(18, 18, 28, 0.72); /* 玻璃面板底 */
      --bg-panel-solid: #121220;          /* 药丸、toast 等实心深色 */
      --bg-item: rgba(255, 255, 255, 0.03);
      --bg-item-hover: rgba(255, 255, 255, 0.06);
      --bg-item-active: rgba(240, 192, 64, 0.08);
      --bg-input: #2a2a3e;
      --bg-btn: #3a3a52;
      --bg-btn-hover: #4a4a66;
      --bg-danger: #4a2430;
      --bg-danger-hover: #5a2a3a;
      --bg-toast: rgba(90, 58, 0, 0.95);
      --bg-badge-warn: #5a3a00;
      --bg-badge-ok: #003a00;
      --bg-time-pill: rgba(10, 10, 18, 0.9);
      --bg-time-knob-a: #fff5e0;
      --bg-time-knob-b: #ffc878;
      --bg-time-knob-c: #e08a2a;
      --bg-fixture-list: rgba(255, 255, 255, 0.03);
      --bg-fixture-list-hover: rgba(255, 255, 255, 0.06);
      --bg-floor-plan: rgba(18, 18, 28, 0.5);
      --bg-floor-plan-svg: rgba(255, 255, 255, 0.02);
      --bg-scrollbar-track: rgba(0, 0, 0, 0.3);
      --bg-scrollbar-thumb: #444;
      --bg-scrollbar-thumb-hover: #666;

      /* 边框（三档粗细 × 两档不透明） */
      --border-subtle: 1px solid rgba(255, 255, 255, 0.10);
      --border-strong: 1px solid rgba(255, 255, 255, 0.22);
      --border-color-strong: rgba(255, 255, 255, 0.22);
      --border-hairline: 1px solid rgba(255, 255, 255, 0.04);
      --border-input: 1px solid #444;
      --border-input-focus: 1px solid var(--accent-warm);
      --border-item: 1px solid #333;
      --border-btn: 1px solid #555;
      --border-danger: 1px solid #7a3a4a;
      --border-time-pill: 1px solid rgba(255, 255, 255, 0.14);
      --border-time-track: 1px solid rgba(255, 255, 255, 0.10);
      --border-time-btn: 1px solid rgba(255, 255, 255, 0.12);
      --border-toast: 1px solid #f0a040;

      /* 玻璃模糊配方 */
      --glass-blur: blur(14px) saturate(1.2);

      /* 阴影 */
      --shadow-glass: 0 0 24px rgba(0, 0, 0, 0.45);
      --shadow-accent: 0 2px 12px rgba(240, 160, 64, 0.35);
      --shadow-time-inset: inset 0 1px 3px rgba(0, 0, 0, 0.5);
      --shadow-time-glow: 0 0 12px 3px rgba(255, 200, 120, 0.6);
      --shadow-time-focus: 0 0 0 3px rgba(240, 160, 64, 0.7), 0 0 12px 3px rgba(255, 200, 120, 0.6);

      /* 强调色 */
      --accent-warm: #f0c040;
      --accent-warm-strong: #f0a040;
      --accent-warm-deep: #e06030;
      --accent-cool: #60a0d0;
      --accent-danger-text: #f0a0a0;

      /* 文字层次（4 档 + 按钮/标签/时间轴） */
      --text-primary: #eee;
      --text-secondary: #aaa;
      --text-muted: #888;
      --text-dim: #666;
      --text-on-accent: #1a1a2e;
      --text-white: #fff;
      --text-scene-btn: #ddd;
      --text-hud-label: #999;

      /* 字体阶梯 */
      --font-size-xs: 10px;
      --font-size-sm: 11px;
      --font-size-body: 12px;
      --font-size-md: 13px;
      --font-size-lg: 14px;
      --font-size-title: 16px;

      /* 圆角（4 档） */
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 999px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-deep); color: var(--text-primary); overflow: hidden; }
    #app { width: 100vw; height: 100vh; position: relative; }
    .app-root { width: 100%; height: 100%; position: relative; }
    .canvas-container { position: absolute; inset: 0; }
    canvas { display: block; }

    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: var(--font-size-title); }

    /* 顶部信息覆盖层（玻璃质感）— P26a 拆两块 HUD：overlay 只负责定位，
       每块 hud-block 各自玻璃面板 + padding；左右各预留 340px 通道避开
       两侧展开的 sidebar（320px + 22px toggle）。 */
    .overlay { position: absolute; top: 10px; left: 10px; right: 340px; display: flex; gap: 12px; align-items: flex-start; z-index: 5; pointer-events: none; }
    .overlay .hud-block { background: var(--bg-panel); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: var(--border-subtle); border-radius: var(--radius-lg); padding: 10px 14px; font-size: var(--font-size-md); line-height: 1.5; }
    .overlay .title { font-weight: 700; font-size: var(--font-size-title); margin-bottom: 4px; color: var(--accent-warm); letter-spacing: 0.02em; }
    .overlay .info { color: var(--text-secondary); }
    .overlay .warning { color: var(--accent-warm-strong); }

    /* P19：面板内的小字说明（复用 --text-muted / --font-size-xs，不新增 token） */
    .field-note { color: var(--text-muted); font-size: var(--font-size-xs); line-height: 1.4; }

    /* HUD 数字统计（overlay 内）—— 默认只显示 FPS 一行，点 ⓘ 展开细节 */
    .hud-stats { margin-top: 6px; padding-top: 6px; border-top: var(--border-subtle); display: flex; flex-direction: column; gap: 4px; }
    .hud-toggle { width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 2px 0; color: inherit; font: inherit; }
    .hud-toggle:hover .hud-label { color: var(--text-primary); }
    .hud-toggle .hud-caret { margin-left: auto; font-size: var(--font-size-xs); color: var(--text-muted); }
    .hud-details { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
    .hud-row { display: flex; justify-content: space-between; gap: 16px; }
    .hud-label { color: var(--text-muted); font-size: var(--font-size-xs); }
    .hud-value { color: var(--text-white); font-size: var(--font-size-lg); font-variant-numeric: tabular-nums; }

    /* 底部时间轴（P8c：替换原 .controls） */
    .time-axis { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: var(--bg-panel); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: var(--border-subtle); border-radius: var(--radius-lg); padding: 10px 16px; font-size: var(--font-size-md); display: flex; gap: 14px; align-items: center; z-index: 5; width: min(680px, 72vw); }
    .time-pill { border-radius: var(--radius-pill); background: var(--bg-time-pill); border: var(--border-time-pill); padding: 4px 12px; color: var(--text-white); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .time-track-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .time-track { position: relative; height: 12px; border-radius: var(--radius-pill); cursor: pointer; box-shadow: var(--shadow-time-inset); touch-action: none; }
    .time-knob { position: absolute; top: 50%; width: 16px; height: 16px; margin-left: -8px; transform: translateY(-50%); border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--bg-time-knob-a), var(--bg-time-knob-b) 55%, var(--bg-time-knob-c)); box-shadow: var(--shadow-time-glow); cursor: grab; outline: none; }
    .time-knob:focus-visible { box-shadow: var(--shadow-time-focus); }
    .time-knob:active { cursor: grabbing; }
    .time-ticks { display: flex; justify-content: space-between; padding: 0 1px; }
    .time-tick { font-size: var(--font-size-xs); color: var(--text-muted); }
    .time-axis-side { display: flex; flex-direction: column; gap: 6px; min-width: 110px; }
    .time-axis-ctl { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: var(--font-size-sm); white-space: nowrap; }
    .time-axis-ctl input[type="range"] { flex: 1; }
    .build-badge { position: absolute; bottom: 10px; right: 10px; background: var(--bg-panel); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: var(--border-subtle); border-radius: var(--radius-md); padding: 4px 10px; color: var(--text-dim); font-size: var(--font-size-sm); z-index: 8; font-variant-numeric: tabular-nums; }

    /* 侧栏（玻璃质感） */
    .sidebar { position: absolute; top: 0; bottom: 0; width: 320px; z-index: 6; display: flex; box-shadow: var(--shadow-glass); }
    .sidebar-left { left: 0; border-right: var(--border-subtle); }
    .sidebar-right { right: 0; border-left: var(--border-subtle); }
    .sidebar.collapsed { width: 0; }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 56px 10px 70px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar-toggle { position: absolute; top: 50%; transform: translateY(-50%); z-index: 7; background: var(--bg-panel); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: var(--border-subtle); border-radius: var(--radius-xs); width: 22px; height: 60px; cursor: pointer; font-size: var(--font-size-sm); color: var(--text-secondary); padding: 0; transition: background 0.15s ease, border-color 0.15s ease; }
    .sidebar-toggle:hover { background: var(--bg-item-hover); border-color: var(--border-strong); }
    .sidebar-left .sidebar-toggle { right: -22px; }
    .sidebar-left.collapsed .sidebar-toggle { right: -22px; }
    .sidebar-right .sidebar-toggle { left: -22px; }
    .sidebar-right.collapsed .sidebar-toggle { left: -22px; }

    /* 可折叠面板（玻璃质感） */
    .panel { background: var(--bg-panel); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: var(--border-subtle); border-radius: var(--radius-lg); font-size: var(--font-size-md); overflow: hidden; flex-shrink: 0; }
    .panel-header { width: 100%; display: flex; align-items: center; gap: 6px; background: var(--bg-item); border: none; color: var(--accent-warm); font-weight: 700; font-size: var(--font-size-md); padding: 8px 10px; cursor: pointer; text-align: left; }
    .panel-header:hover { background: var(--bg-item-hover); }
    .panel-caret { font-size: var(--font-size-xs); color: var(--text-muted); }
    .panel-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 110px); overflow-y: auto; }
    .panel-body::-webkit-scrollbar { width: 8px; }
    .panel-body::-webkit-scrollbar-track { background: var(--bg-scrollbar-track); }
    .panel-body::-webkit-scrollbar-thumb { background: var(--bg-scrollbar-thumb); border-radius: var(--radius-xs); }
    .panel-body::-webkit-scrollbar-thumb:hover { background: var(--bg-scrollbar-thumb-hover); }

    .panel-row { display: flex; gap: 6px; }
    .panel-row .input { flex: 1; }

    .item-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .item { background: var(--bg-item); border: var(--border-item); border-radius: var(--radius-sm); padding: 6px 8px; cursor: pointer; }
    .item:hover { background: var(--bg-item-hover); }
    .item.selected { border-color: var(--accent-warm); background: var(--bg-item-active); }
    .item-head { display: flex; gap: 6px; align-items: center; }
    .item-name { flex: 1; font-weight: 600; }
    .item-meta { color: var(--text-hud-label); font-size: var(--font-size-body); margin-top: 4px; }

    /* 表单控件 */
    .input { background: var(--bg-input); color: var(--text-primary); border: var(--border-input); border-radius: var(--radius-xs); padding: 4px 6px; font-size: var(--font-size-md); width: 100%; }
    .input:focus { outline: none; border: var(--border-input-focus); }
    select.input { cursor: pointer; }
    .btn { background: var(--bg-btn); color: var(--text-primary); border: var(--border-btn); border-radius: var(--radius-xs); padding: 4px 10px; font-size: var(--font-size-md); cursor: pointer; white-space: nowrap; }
    .btn:hover { background: var(--bg-btn-hover); }
    .btn-danger { background: var(--bg-danger); border: var(--border-danger); color: var(--accent-danger-text); }
    .btn-danger:hover { background: var(--bg-danger-hover); }

    .field { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .field.disabled { opacity: 0.5; }
    .field-label { color: var(--text-hud-label); font-size: var(--font-size-sm); white-space: nowrap; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group-title { color: var(--accent-warm); font-size: var(--font-size-sm); font-weight: 600; }
    .field-row { display: flex; gap: 6px; }
    .field input[type="range"] { width: 100%; }

    .fixture-form { display: flex; flex-direction: column; gap: 12px; }
    .fixture-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .fixture-type { font-weight: 700; color: var(--accent-warm); text-transform: capitalize; }
    .fixture-id { color: var(--text-muted); font-size: var(--font-size-sm); }

    /* 灯具选择列表 */
    .fixture-list { display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow-y: auto; }
    .fixture-list-item { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%;
      background: var(--bg-item); border: var(--border-item); border-radius: var(--radius-sm); padding: 6px 8px;
      color: var(--text-primary); font-size: var(--font-size-body); cursor: pointer; text-align: left; }
    .fixture-list-item:hover { background: var(--bg-item-hover); }
    .fixture-list-item.active { border-color: var(--accent-warm); background: var(--bg-item-active); }
    .fixture-list-name { font-weight: 600; white-space: nowrap; }
    .fixture-list-meta { color: var(--text-hud-label); font-size: var(--font-size-sm); white-space: nowrap; }

    .empty { color: var(--text-muted); font-size: var(--font-size-body); padding: 8px 4px; text-align: center; }

    /* 场景按钮（暖色渐变药丸） */
    .scene-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .scene-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }
    .scene-btn { padding: 8px 12px; border-radius: var(--radius-pill); background: var(--bg-item); border: var(--border-time-btn); color: var(--text-scene-btn); font-weight: 500; transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease; }
    .scene-btn:hover { background: var(--bg-item-hover); border-color: var(--border-color-strong); }
    .scene-btn:active { transform: scale(0.98); }
    .scene-btn:disabled { opacity: 0.5; pointer-events: none; }
    .scene-btn.active { background: linear-gradient(135deg, var(--accent-warm-strong), var(--accent-warm-deep)); border-color: transparent; color: var(--text-on-accent); font-weight: 700; box-shadow: var(--shadow-accent); }

    /* 2D 户型图（P8f） */
    .floor-plan { background: var(--bg-floor-plan); border: var(--border-subtle); border-radius: var(--radius-md); padding: 8px; margin-bottom: 8px; flex-shrink: 0; }
    .floor-plan-title { font-size: var(--font-size-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; padding-left: 2px; }
    .floor-plan-svg { display: block; background: var(--bg-floor-plan-svg); border-radius: var(--radius-sm); }
    .floor-plan-zone text { user-select: none; }
    .floor-plan-fixture { user-select: none; }

    /* 照度行 */
    .illuminance-row { background: var(--bg-item); border: var(--border-item); border-radius: var(--radius-sm); padding: 6px 8px; }
    .illuminance-name { font-weight: 600; margin-bottom: 2px; }
    .illuminance-value { color: var(--text-secondary); font-size: var(--font-size-body); line-height: 1.4; }

    .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: var(--font-size-sm); }
    /* badge-warn / badge-ok 是业务语义色（黄色警告 / 绿色通过），本轮不改。 */
    .badge-warn { background: #5a3a00; color: #f0a040; }
    .badge-ok { background: #003a00; color: #40f040; }

    .toast { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); background: var(--bg-toast); color: var(--accent-warm-strong); padding: 10px 18px; border-radius: var(--radius-md); font-size: var(--font-size-md); border: var(--border-toast); z-index: 10; animation: toast-in .25s ease; }
    @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
