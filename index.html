<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina — 家庭灯光设计系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
    #app { width: 100vw; height: 100vh; position: relative; }
    .app-root { width: 100%; height: 100%; position: relative; }
    .canvas-container { position: absolute; inset: 0; }
    canvas { display: block; }

    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 18px; }

    /* 顶部信息覆盖层（玻璃质感） */
    .overlay { position: absolute; top: 10px; left: 10px; background: rgba(18,18,28,0.72); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; padding: 12px 16px; font-size: 13px; line-height: 1.6; pointer-events: none; z-index: 5; }
    .overlay .title { font-weight: 700; font-size: 16px; margin-bottom: 4px; color: #f0c040; letter-spacing: 0.02em; }
    .overlay .info { color: #aaa; }
    .overlay .warning { color: #f0a040; }

    /* HUD 数字统计（overlay 内） */
    .hud-stats { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.10); display: flex; flex-direction: column; gap: 2px; }
    .hud-row { display: flex; justify-content: space-between; gap: 16px; }
    .hud-label { color: #888; font-size: 12px; }
    .hud-value { color: #fff; font-size: 14px; font-variant-numeric: tabular-nums; }

    /* 底部时间轴（P8c：替换原 .controls） */
    .time-axis { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(18,18,28,0.72); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; padding: 10px 16px; font-size: 13px; display: flex; gap: 14px; align-items: center; z-index: 5; width: min(680px, 72vw); }
    .time-pill { border-radius: 999px; background: rgba(10,10,18,0.9); border: 1px solid rgba(255,255,255,0.14); padding: 4px 12px; color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .time-track-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .time-track { position: relative; height: 12px; border-radius: 999px; cursor: pointer; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); touch-action: none; }
    .time-knob { position: absolute; top: 50%; width: 16px; height: 16px; margin-left: -8px; transform: translateY(-50%); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff5e0, #ffc878 55%, #e08a2a); box-shadow: 0 0 12px 3px rgba(255,200,120,0.6); cursor: grab; outline: none; }
    .time-knob:focus-visible { box-shadow: 0 0 0 3px rgba(240,160,64,0.7), 0 0 12px 3px rgba(255,200,120,0.6); }
    .time-knob:active { cursor: grabbing; }
    .time-ticks { display: flex; justify-content: space-between; padding: 0 1px; }
    .time-tick { font-size: 10px; color: #888; }
    .time-axis-side { display: flex; flex-direction: column; gap: 6px; min-width: 110px; }
    .time-axis-ctl { display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 11px; white-space: nowrap; }
    .time-axis-ctl input[type="range"] { flex: 1; }
    .build-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(18,18,28,0.72); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid rgba(255,255,255,0.10); border-radius: 8px; padding: 4px 10px; color: #666; font-size: 11px; z-index: 8; font-variant-numeric: tabular-nums; }

    /* 侧栏（玻璃质感） */
    .sidebar { position: absolute; top: 0; bottom: 0; width: 320px; z-index: 6; display: flex; box-shadow: 0 0 24px rgba(0,0,0,0.45); }
    .sidebar-left { left: 0; border-right: 1px solid rgba(255,255,255,0.10); }
    .sidebar-right { right: 0; border-left: 1px solid rgba(255,255,255,0.10); }
    .sidebar.collapsed { width: 0; }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 56px 10px 70px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar-toggle { position: absolute; top: 50%; transform: translateY(-50%); z-index: 7; background: rgba(0,0,0,0.7); color: #eee; border: 1px solid #444; border-radius: 4px; width: 20px; height: 48px; cursor: pointer; font-size: 11px; padding: 0; }
    .sidebar-left .sidebar-toggle { right: -20px; }
    .sidebar-left.collapsed .sidebar-toggle { right: -20px; }
    .sidebar-right .sidebar-toggle { left: -20px; }
    .sidebar-right.collapsed .sidebar-toggle { left: -20px; }

    /* 可折叠面板（玻璃质感） */
    .panel { background: rgba(18,18,28,0.72); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; font-size: 13px; overflow: hidden; flex-shrink: 0; }
    .panel-header { width: 100%; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); border: none; color: #f0c040; font-weight: 700; font-size: 13px; padding: 8px 10px; cursor: pointer; text-align: left; }
    .panel-header:hover { background: rgba(255,255,255,0.08); }
    .panel-caret { font-size: 10px; color: #888; }
    .panel-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 110px); overflow-y: auto; }
    .panel-body::-webkit-scrollbar { width: 8px; }
    .panel-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    .panel-body::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    .panel-body::-webkit-scrollbar-thumb:hover { background: #666; }

    .panel-row { display: flex; gap: 6px; }
    .panel-row .input { flex: 1; }

    .item-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .item { background: rgba(255,255,255,0.03); border: 1px solid #333; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
    .item:hover { background: rgba(255,255,255,0.06); }
    .item.selected { border-color: #f0c040; background: rgba(240,192,64,0.08); }
    .item-head { display: flex; gap: 6px; align-items: center; }
    .item-name { flex: 1; font-weight: 600; }
    .item-meta { color: #999; font-size: 12px; margin-top: 4px; }

    /* 表单控件 */
    .input { background: #2a2a3e; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; font-size: 13px; width: 100%; }
    .input:focus { outline: none; border-color: #f0c040; }
    select.input { cursor: pointer; }
    .btn { background: #3a3a52; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: #4a4a66; }
    .btn-danger { background: #4a2430; border-color: #7a3a4a; color: #f0a0a0; }
    .btn-danger:hover { background: #5a2a3a; }

    .field { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .field.disabled { opacity: 0.5; }
    .field-label { color: #999; font-size: 11px; white-space: nowrap; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group-title { color: #f0c040; font-size: 11px; font-weight: 600; }
    .field-row { display: flex; gap: 6px; }
    .field input[type="range"] { width: 100%; }

    .fixture-form { display: flex; flex-direction: column; gap: 12px; }
    .fixture-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .fixture-type { font-weight: 700; color: #f0c040; text-transform: capitalize; }
    .fixture-id { color: #777; font-size: 11px; }

    /* 灯具选择列表 */
    .fixture-list { display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow-y: auto; }
    .fixture-list-item { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%;
      background: rgba(255,255,255,0.03); border: 1px solid #333; border-radius: 6px; padding: 6px 8px;
      color: #eee; font-size: 12px; cursor: pointer; text-align: left; }
    .fixture-list-item:hover { background: rgba(255,255,255,0.06); }
    .fixture-list-item.active { border-color: #f0c040; background: rgba(240,192,64,0.08); }
    .fixture-list-name { font-weight: 600; white-space: nowrap; }
    .fixture-list-meta { color: #999; font-size: 11px; white-space: nowrap; }

    .empty { color: #777; font-size: 12px; padding: 8px 4px; text-align: center; }

    /* 场景按钮（暖色渐变药丸） */
    .scene-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .scene-btn { padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #ddd; font-weight: 500; }
    .scene-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.22); }
    .scene-btn.active { background: linear-gradient(135deg, #f0a040, #e06030); border-color: transparent; color: #1a1a2e; font-weight: 700; box-shadow: 0 2px 12px rgba(240,160,64,0.35); }

    /* 2D 户型图（P8f） */
    .floor-plan { background: rgba(18,18,28,0.5); border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; padding: 8px; margin-bottom: 8px; flex-shrink: 0; }
    .floor-plan-title { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; padding-left: 2px; }
    .floor-plan-svg { display: block; background: rgba(255,255,255,0.02); border-radius: 6px; }
    .floor-plan-zone text { user-select: none; }
    .floor-plan-fixture { user-select: none; }

    /* 照度行 */
    .illuminance-row { background: rgba(255,255,255,0.03); border: 1px solid #333; border-radius: 6px; padding: 6px 8px; }
    .illuminance-name { font-weight: 600; margin-bottom: 2px; }
    .illuminance-value { color: #aaa; font-size: 12px; line-height: 1.4; }

    .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
    .badge-warn { background: #5a3a00; color: #f0a040; }
    .badge-ok { background: #003a00; color: #40f040; }

    .toast { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); background: rgba(90,58,0,0.95); color: #f0a040; padding: 10px 18px; border-radius: 8px; font-size: 13px; border: 1px solid #f0a040; z-index: 10; animation: toast-in .25s ease; }
    @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
