<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina — 家庭灯光设计系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
    #app { width: 100vw; height: 100vh; position: relative; }
    #canvas-container { width: 100%; height: 100%; }
    canvas { display: block; }
    .overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.6; pointer-events: none; }
    .overlay .title { font-weight: 700; font-size: 16px; margin-bottom: 4px; color: #f0c040; }
    .overlay .info { color: #aaa; }
    .overlay .warning { color: #f0a040; }
    .controls { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px; font-size: 13px; display: flex; gap: 12px; align-items: center; }
    .controls label { display: flex; align-items: center; gap: 6px; }
    .controls input[type="range"] { width: 120px; }
    .controls input[type="time"] { background: #333; color: #eee; border: 1px solid #555; padding: 2px 6px; border-radius: 4px; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
    .badge-warn { background: #5a3a00; color: #f0a040; }
    .badge-ok { background: #003a00; color: #40f040; }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>
    <div class="overlay">
      <div class="title">Lumina — 灯光设计系统</div>
      <div class="info" id="backend-info">加载中...</div>
      <div class="info" id="time-info"></div>
      <div class="warning" id="warning-info"></div>
    </div>
    <div class="controls">
      <label>时间: <input type="time" id="time-input" value="18:00" step="600" /></label>
      <label>速度: <input type="range" id="speed-input" min="0" max="3" step="0.1" value="0.5" /></label>
      <label><input type="checkbox" id="shadow-toggle" checked /> 阴影</label>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
